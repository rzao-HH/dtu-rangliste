  const ITER = 250000;

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function entschluessele(passwort) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(passwort), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: ITER, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const klartext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(IV) }, key, b64ToBytes(CT));
    return new TextDecoder().decode(klartext);
  }

  function zeige(html) {
    document.open();
    document.write(html);
    document.close();
  }

  async function versuch(pw, speichern) {
    const html = await entschluessele(pw);   // wirft bei falschem Passwort
    if (speichern) { try { sessionStorage.setItem("rl_pw", pw); } catch (e) {} }
    zeige(html);
  }

  // Im selben Tab gemerktes Passwort automatisch probieren
  (async function () {
    let gespeichert = null;
    try { gespeichert = sessionStorage.getItem("rl_pw"); } catch (e) {}
    if (gespeichert) {
      try { await versuch(gespeichert, false); return; } catch (e) {
        try { sessionStorage.removeItem("rl_pw"); } catch (e2) {}
      }
    }
  })();

  document.getElementById("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    const pw = document.getElementById("pw").value;
    try {
      await versuch(pw, true);
    } catch (ex) {
      err.textContent = "Falsches Passwort.";
      document.getElementById("pw").value = "";
      document.getElementById("pw").focus();
    }
  });
})();
